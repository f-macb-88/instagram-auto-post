name: JobType64 TikTok Trial Winner

# インスタのトライアルで2日たった本から、一番再生が多い版を TikTok に予約する（tiktok_trial_winner.py）。
# 投稿そのものは post.yml（5分ごと）が行う。2026-11-27 渕山さん指示
on:
  schedule:
    - cron: "17 * * * *"   # 1時間ごと（UTC。中身は JST で判定）
  workflow_dispatch:
    inputs:
      dry_run:
        description: "判定を表示するだけ（true/false）"
        default: "false"

# 投稿の処理とシートの書き込みが重ならないよう、post.yml と同じ組で順番に動かす
concurrency:
  group: ig-auto-post
  cancel-in-progress: false

jobs:
  pick:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Unit tests
        run: python -m unittest test_tiktok_trial_winner

      - name: Pick winner
        run: |
          ARGS=()
          if [ "$IN_DRY_RUN" = "true" ]; then ARGS+=(--dry-run); fi
          python tiktok_trial_winner.py "${ARGS[@]}"
        env:
          IN_DRY_RUN: ${{ inputs.dry_run }}
          SPREADSHEET_ID_JOBTYPE64: ${{ secrets.SPREADSHEET_ID_JOBTYPE64 }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SLACK_DM_WEBHOOK_URL: ${{ secrets.SLACK_DM_WEBHOOK_URL }}
          IG_USER_ID_JOBTYPE64: ${{ secrets.IG_USER_ID_JOBTYPE64 }}
          IG_ACCESS_TOKEN_JOBTYPE64: ${{ secrets.IG_ACCESS_TOKEN_JOBTYPE64 }}
          DRIVE_FOLDER_ID_JOBTYPE64: ${{ secrets.DRIVE_FOLDER_ID_JOBTYPE64 }}
          DRIVE_EXTRA_FOLDER_IDS_JOBTYPE64: ${{ secrets.DRIVE_EXTRA_FOLDER_IDS_JOBTYPE64 }}
