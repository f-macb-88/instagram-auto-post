name: Instagram Reel Auto Post

on:
  schedule:
    # 5分ごとに実行（UTC基準だが内容はJSTで判定）。投稿予定時刻は最大5分以内のズレで反映される。
    # Publicリポジトリのため Actions 実行時間は無料・無制限。
    - cron: "*/5 * * * *"
  workflow_dispatch: {}  # 画面から手動実行も可能

# 同時に複数実行されないようにする（二重投稿防止）
concurrency:
  group: ig-auto-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    # Instagram の動画処理待ち（最大10分）と TikTok の公開待ち（最大10分）が同じ回に重なっても切れないように30分
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Post reels
        run: python post_reel.py
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          CLOUDINARY_URL: ${{ secrets.CLOUDINARY_URL }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          # ジョブタイプ64（@jobtype64）。未設定でも love64 の投稿は止まらない
          IG_USER_ID_JOBTYPE64: ${{ secrets.IG_USER_ID_JOBTYPE64 }}
          IG_ACCESS_TOKEN_JOBTYPE64: ${{ secrets.IG_ACCESS_TOKEN_JOBTYPE64 }}
          DRIVE_FOLDER_ID_JOBTYPE64: ${{ secrets.DRIVE_FOLDER_ID_JOBTYPE64 }}
          # TikTok（Buffer 経由）。未設定でも Instagram の投稿は止まらない（TikTok の行だけエラー）
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_CHANNEL_TIKTOK_JOBTYPE64: ${{ secrets.BUFFER_CHANNEL_TIKTOK_JOBTYPE64 }}
          BUFFER_CHANNEL_TIKTOK_LOVE64: ${{ secrets.BUFFER_CHANNEL_TIKTOK_LOVE64 }}
